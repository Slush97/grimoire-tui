[workspace]
members = [".", "crates/grimoire-core"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "grimoire-tui"
description = "Terminal frontend for Grimoire, the Deadlock mod manager."
version = "0.1.0"
edition = "2021"
# ratatui 0.30 needs 1.86.
rust-version = "1.86"
license = "MIT"

[dependencies]
base64 = "0.22"
dirs = "6"
grimoire-core = { path = "crates/grimoire-core" }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.20.2"
tempfile = "3"
toml_edit = { version = "0.25.15", features = ["serde"] }
unicode-width = "0.2"
unrar = "0.5.8"
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
